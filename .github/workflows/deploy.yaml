name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PORT: ${{ secrets.PORT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EMAIL_ID: ${{ secrets.EMAIL_ID }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DIALECT: ${{ secrets.DB_DIALECT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Debug connection
        run: |
          echo "DB_HOST: $DB_HOST"
          echo "DB_USER: $DB_USER"
          echo "DB_PASS: $DB_PASS"
          echo "DB_NAME: $DB_NAME"
          echo "DB_PORT: $DB_PORT"

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd doc-ai-backend/DocAi
            git remote set-url origin git@github.com:bratinkundu/DocAi.git
            git pull origin main

             # Debugging: Print environment variables to a file
            echo "PORT: $PORT" >> debug_env.txt
            echo "GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID" >> debug_env.txt
            echo "GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET" >> debug_env.txt
            echo "JWT_SECRET: $JWT_SECRET" >> debug_env.txt
            echo "EMAIL_ID: $EMAIL_ID" >> debug_env.txt
            echo "EMAIL_PASSWORD: $EMAIL_PASSWORD" >> debug_env.txt
            echo "DB_HOST: $DB_HOST" >> debug_env.txt
            echo "DB_USER: $DB_USER" >> debug_env.txt
            echo "DB_PASS: $DB_PASS" >> debug_env.txt
            echo "DB_NAME: $DB_NAME" >> debug_env.txt
            echo "DB_PORT: $DB_PORT" >> debug_env.txt
            echo "DB_DIALECT: $DB_DIALECT" >> debug_env.txt

            # Output the content of debug_env.txt
            cat debug_env.txt

            # Debugging: Test database connection
            psql -h $DB_HOST -U $DB_USER -d $DB_NAME -p $DB_PORT -c '\conninfo'

            export PORT=$PORT
            export DB_HOST=$DB_HOST
            export DB_USER=$DB_USER
            export DB_PASS=$DB_PASS
            export DB_NAME=$DB_NAME
            export DB_PORT=$DB_PORT
            export DB_DIALECT=$DB_DIALECT
            npm install
            npm run build
            npm start
